[project]
name = "llmsplay"
version = "2026.8.0"
description = "Personal playground for learning LLMs, Transformers, and AI agents"
requires-python = ">=3.11"
dependencies = [
    # OpenAI API + agents
    "openai==2.41.1",
    "langchain==1.3.8",
    "langchain-classic==1.0.8",
    "langchain-openai==1.3.0",
    "langgraph==1.2.4",

    # Experiment tracking
    "mlflow==3.13.0",

    # Ollama Python client — communicates with the ollama-service container
    "ollama==0.6.2",
    
    # Data manipulation
    "numpy==2.4.6",
    "pandas==2.3.3",
    "scikit-learn==1.9.0",
    "tiktoken==0.13.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",
    "pytest==9.1.0",
    "jupyterlab==4.5.8",
    "ipywidgets==8.1.8",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
    "ruff==0.16.0",
]

[project.optional-dependencies]
cpu = [
    "torch==2.12.0",
    "torchvision==0.27.0",
    "torchaudio==2.11.0",
    "lightning==2.6.5",
]
gpu = [
    "torch>=2.5",
    "torchvision>=0.20",
    "torchaudio>=2.5",
    "lightning>=2.4",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmsplay"]

[tool.ruff]
target-version = "py311"
line-length = 90 # Default line length is 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"  # Options: "single", "double", or "preserve"
indent-style = "space"  # Options: "tab", "space"
